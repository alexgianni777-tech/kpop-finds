name: Deploy K-Pop Finds

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate site
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path(".")
          index = Path("index.html").read_text(encoding="utf-8")
          catalog = json.loads(Path("catalog.json").read_text(encoding="utf-8"))
          products = json.loads(Path("verified-products.json").read_text(encoding="utf-8"))
          guides = list(Path("guides").glob("*.html"))
          watch_pages = list(Path("watch").glob("*.html"))

          assert len(catalog) == 8
          assert len(products) == 24
          assert len(guides) == 18
          assert len(watch_pages) == 8
          assert "K‑Pop Finds" in index
          assert "index,follow" in index
          assert "As an Amazon Associate I earn from qualifying purchases." in index
          assert Path("assets/style.css").exists()
          assert Path("assets/app.js").exists()
          assert Path("assets/ads-config.js").exists()
          assert Path("assets/ads.js").exists()
          assert Path("privacy.html").exists()
          assert Path("media-credits.html").exists()
          assert Path("products.html").exists()
          assert Path("watch.html").exists()
          assert Path("verified-products.json").exists()
          assert Path("sitemap.xml").exists()
          assert Path("robots.txt").exists()
          assert Path("ads.txt").exists()
          assert "https://kpopfinds.online/" in index
          assert "alexgianni777-tech.github.io/kpop-finds" not in index
          assert "https://kpopfinds.online/" in Path("sitemap.xml").read_text(encoding="utf-8")
          assert "https://kpopfinds.online/sitemap.xml" in Path("robots.txt").read_text(encoding="utf-8")
          assert Path("ads.txt").read_text(encoding="utf-8").strip() == "google.com, pub-8108579336605864, DIRECT, f08c47fec0942fa0"
          adsense_snippet = 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8108579336605864'
          for html_path in list(Path(".").glob("*.html")) + list(Path("guides").glob("*.html")) + list(Path("watch").glob("*.html")):
              assert adsense_snippet in html_path.read_text(encoding="utf-8"), html_path
          assert index.count('class="artist-photo"') >= 7
          assert index.count('class="video-link"') == 8
          assert index.count("youtube.com/watch") >= 8
          for artist in catalog:
              assert artist.get("youtubeUrl"), artist["slug"]
              if artist["slug"] != "kpop-demon-hunters":
                  assert artist.get("artistImage"), artist["slug"]
                  assert artist.get("photoSource"), artist["slug"]

          for p in [Path("index.html"), Path("privacy.html"), Path("media-credits.html"), Path("products.html"), Path("watch.html"), *guides, *watch_pages]:
              html = p.read_text(encoding="utf-8")
              assert "<title>" in html
              assert "<meta name=\"description\"" in html

          for p in guides:
              html = p.read_text(encoding="utf-8")
              assert 'rel="canonical"' in html
              if p.name != "index.html":
                  assert 'rel="sponsored nofollow noopener noreferrer"' in html

          for p in [Path("index.html"), Path("products.html"), Path("watch.html"), *guides, *watch_pages]:
              html = p.read_text(encoding="utf-8")
              assert 'content="index,follow"' in html
              assert 'rel="canonical"' in html

          for p in [Path("guides") / f"{artist['slug']}.html" for artist in catalog]:
              html = p.read_text(encoding="utf-8")
              assert 'class="real-product-strip"' in html

          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          assert sitemap.count("<url>") == 29
          for required in [
              "/guides/how-to-buy-official-kpop-merch.html",
              "/guides/kpop-concert-essentials.html",
              "/guides/kpop-album-gift-guide.html",
              "/guides/kpop-photocard-binder-guide.html",
              "/guides/kpop-gifts-for-beginners.html",
              "/guides/kpop-gifts-under-25.html",
              "/guides/index.html",
          ]:
              assert required in sitemap

          products_html = Path("products.html").read_text(encoding="utf-8")
          assert products_html.count('class="verified-product"') == 24
          assert products_html.count('Verified official product') >= 24
          assert "https://www.amazon.com/dp/B0GGCX8XSP?tag=unicornmagic2-20" in products_html

          blackpink = [p for p in products if p.get("artist") == "BLACKPINK" and "PINK Ver." in p.get("title", "")]
          assert len(blackpink) == 1
          assert blackpink[0].get("amazonAsin") == "B0GGCX8XSP"
          assert blackpink[0].get("amazonUrl") == "https://www.amazon.com/dp/B0GGCX8XSP?tag=unicornmagic2-20"

          for product in products:
              amazon_url = product.get("amazonUrl")
              if not amazon_url:
                  continue
              asin = product.get("amazonAsin")
              assert asin, product.get("title")
              assert f"/dp/{asin}" in amazon_url, product.get("title")
              assert "tag=unicornmagic2-20" in amazon_url, product.get("title")
          assert Path("9f0e3d7b8c1a4f6e92d0b7c3a1e5f864.txt").read_text(encoding="utf-8").strip() == "9f0e3d7b8c1a4f6e92d0b7c3a1e5f864"
          assert Path(".github/workflows/indexnow.yml").exists()

          for p in watch_pages:
              html = p.read_text(encoding="utf-8")
              assert "youtube-nocookie.com/embed/" in html
              assert 'class="verified-product"' in html
              assert "../products.html" in html

          print("K-Pop Finds validation passed.")
          PY
      - name: Inject Google Analytics
        env:
          GA_MEASUREMENT_ID: G-R2WZN848NX
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re

          ga_id = os.environ["GA_MEASUREMENT_ID"]
          snippet = f"""<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={ga_id}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{ga_id}');

            // Track Amazon affiliate clicks as a dedicated GA4 event.
            document.addEventListener('click', function(event) {{
              const link = event.target.closest('a[href]');
              if (!link) return;

              let url;
              try {{
                url = new URL(link.href, window.location.href);
              }} catch (e) {{
                return;
              }}

              const host = url.hostname.toLowerCase().replace(/^www\./, '');
              const isAmazon = host === 'amzn.to' || host === 'amazon.com' || host.startsWith('amazon.') || host.includes('.amazon.');
              const officialHosts = ['shop.weverse.io','weverse.io','jypj-store.com','shop.katseye.world','global.shop.smtown.com','twiceshop.com','netflix.shop','starship-square.com','www.starship-square.com'];

              const card = link.closest('.verified-product, .real-product-strip, .product-card, article, li');
              const heading = card ? card.querySelector('h1, h2, h3, h4') : null;
              const payload = {{
                link_url: url.href,
                link_text: (link.textContent || '').trim().slice(0, 120),
                item_name: heading ? heading.textContent.trim().slice(0, 120) : '',
                item_group: card && card.dataset ? (card.dataset.slug || '') : '',
                page_path: window.location.pathname
              }};

              if (isAmazon) {{
                gtag('event', 'amazon_click', payload);
              }} else if (officialHosts.includes(host)) {{
                gtag('event', 'official_store_click', payload);
              }}
            }});
          </script>"""

          html_paths = (
              list(Path(".").glob("*.html"))
              + list(Path("guides").glob("*.html"))
              + list(Path("watch").glob("*.html"))
              + list(Path("tools").glob("*.html"))
          )

          for p in html_paths:
              html = p.read_text(encoding="utf-8")
              if ga_id in html:
                  continue
              match = re.search(r"<head\b[^>]*>", html, flags=re.IGNORECASE)
              if not match:
                  raise RuntimeError(f"No <head> tag found in {p}")
              html = html[:match.end()] + "\n  " + snippet.replace("\n", "\n  ") + "\n" + html[match.end():]
              p.write_text(html, encoding="utf-8")

          print(f"Google Analytics {ga_id} injected into {len(html_paths)} HTML pages.")
          PY
      - name: Enrich SEO metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          base = "https://kpopfinds.online"
          default_image = base + "/assets/kpop-finds-card.svg"
          favicon = '<link rel="icon" href="/assets/kpop-finds-card.svg" type="image/svg+xml">'
          og_image = f'<meta property="og:image" content="{default_image}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="{default_image}">'

          def repair(obj):
              if isinstance(obj, list):
                  for item in obj:
                      repair(item)
              elif isinstance(obj, dict):
                  types = obj.get("@type")
                  type_set = set(types if isinstance(types, list) else [types]) if types else set()
                  if "Article" in type_set and "image" not in obj:
                      obj["image"] = [default_image]
                  if "Organization" in type_set and "logo" not in obj:
                      obj["logo"] = {"@type":"ImageObject","url":default_image}
                  for value in obj.values():
                      repair(value)

          html_paths = list(Path(".").glob("*.html")) + list(Path("guides").glob("*.html")) + list(Path("watch").glob("*.html")) + list(Path("tools").glob("*.html"))
          for p in html_paths:
              html = p.read_text(encoding="utf-8")
              if "kpop-christmas-gifts.html" not in html:
                  href = "../guides/kpop-christmas-gifts.html" if p.parent.name in {"guides", "watch", "tools"} else "./guides/kpop-christmas-gifts.html"
                  seasonal = f'<a class="nav-seasonal" href="{href}">Christmas gifts</a>'
                  html = html.replace("</nav>", seasonal + "</nav>", 1)
              if 'rel="icon"' not in html:
                  html = html.replace("</head>", favicon + "\n</head>")
              if 'property="og:image"' not in html:
                  html = html.replace("</head>", og_image + "\n</head>")

              scripts = list(re.finditer(r'<script type="application/ld\+json">(.*?)</script>', html, flags=re.S))
              has_article = False
              for m in reversed(scripts):
                  raw = m.group(1)
                  try:
                      data = json.loads(raw)
                  except Exception:
                      continue
                  def contains_article(x):
                      if isinstance(x, list):
                          return any(contains_article(v) for v in x)
                      if isinstance(x, dict):
                          t=x.get("@type")
                          ts=set(t if isinstance(t,list) else [t]) if t else set()
                          return "Article" in ts or any(contains_article(v) for v in x.values())
                      return False
                  has_article = has_article or contains_article(data)
                  repair(data)
                  new = '<script type="application/ld+json">' + json.dumps(data, ensure_ascii=False).replace("<","\\u003c") + '</script>'
                  html = html[:m.start()] + new + html[m.end():]

              if p.parent.name == "guides" and p.name != "index.html" and not has_article:
                  title_match = re.search(r'<title>(.*?)</title>', html, flags=re.S|re.I)
                  desc_match = re.search(r'<meta name="description" content="(.*?)">', html, flags=re.S|re.I)
                  canon_match = re.search(r'<link rel="canonical" href="(.*?)">', html, flags=re.S|re.I)
                  title = re.sub(r'\s+',' ',title_match.group(1)).strip() if title_match else p.stem
                  desc = desc_match.group(1) if desc_match else ""
                  canonical = canon_match.group(1) if canon_match else base + "/guides/" + p.name
                  schema = {
                      "@context":"https://schema.org",
                      "@type":"Article",
                      "headline": title.split(" | ")[0],
                      "description": desc,
                      "url": canonical,
                      "image":[default_image],
                      "datePublished":"2026-10-06",
                      "dateModified":"2026-10-06",
                      "author":{"@type":"Organization","name":"K-Pop Finds","url":base+"/","logo":{"@type":"ImageObject","url":default_image}},
                      "publisher":{"@type":"Organization","name":"K-Pop Finds","url":base+"/","logo":{"@type":"ImageObject","url":default_image}}
                  }
                  snippet='<script type="application/ld+json">' + json.dumps(schema, ensure_ascii=False).replace("<","\\u003c") + '</script>'
                  html=html.replace("</head>",snippet+"\n</head>")

              p.write_text(html, encoding="utf-8")
          print(f"SEO metadata enriched on {len(html_paths)} pages.")
          PY
      - name: Prepare static artifact
        run: touch .nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
